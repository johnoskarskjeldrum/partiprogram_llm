name: CI/CD Pipeline

on:
  push:
    branches: [ main, visual_interface ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify cache directory
      run: |
        if [ -d "cache" ] && [ -f "cache/index.json" ]; then
          echo "✅ Cache directory exists and contains index"
          cache_count=$(ls cache/*.json | wc -l)
          echo "📊 Found $cache_count cached party programs"
        else
          echo "❌ Cache directory missing or invalid"
          echo "💡 Run 'python preprocess_programs.py' to rebuild cache"
          exit 1
        fi
        
    - name: Test preprocessing script (validation only)
      run: |
        # Test that preprocessing still works (for future updates)
        if [ -d "partiprogram" ]; then
          # Create temporary cache to test preprocessing
          mkdir -p temp_cache
          python preprocess_programs.py
          echo "✅ Preprocessing validation passed"
          rm -rf temp_cache
        else
          echo "⚠️ No partiprogram directory found, skipping preprocessing validation"
        fi
        
    - name: Test app imports
      run: |
        python -c "
        try:
            from app import app
            from utils import PartyProgramCache
            print('✅ All imports successful')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "
        
    - name: Check code quality
      run: |
        # Basic syntax check
        python -m py_compile app.py utils.py preprocess_programs.py
        echo "✅ Code syntax check passed"

  # This job only runs on main branch pushes (actual deployments)
  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment notification
      run: |
        echo "🚀 Tests passed! Render.com will automatically deploy this commit."
        echo "⚡ Fast deployment: Cache included in repository (no preprocessing needed)"
        echo "🌐 Your app will be available at: https://partiprogram-llm.onrender.com"
        echo "📝 Check deployment status at: https://dashboard.render.com"
        echo "⏱️ Expected deployment time: ~1-2 minutes"